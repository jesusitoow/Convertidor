[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2mp3"
dynamic = ["version"]
description = "MediaVault: descarga de audio MP3 y vídeo MP4 en máxima calidad con interfaz moderna."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jesús Franco" }]
keywords = ["youtube", "tiktok", "mp3", "mp4", "yt-dlp", "gui", "customtkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "customtkinter>=5.2.2",
    "imageio-ffmpeg>=0.5.1",
    "send2trash>=1.8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyinstaller>=6"]

[project.gui-scripts]
yt2mp3 = "yt2mp3.app:main"

[tool.setuptools.dynamic]
version = { attr = "yt2mp3.__version__" }

[tool.setuptools.packages.find]
include = ["yt2mp3*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP037"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
